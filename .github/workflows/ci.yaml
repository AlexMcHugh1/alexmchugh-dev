name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/github.json'
      - '**/*.md'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/alexmchughdev/alexmchugh-dev

jobs:

  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint
        continue-on-error: true

      - name: npm audit (blocking on critical, production deps)
        run: npm audit --audit-level=critical --omit=dev

      - name: OSV Scanner (SARIF for Security tab)
        uses: google/osv-scanner-action/osv-scanner-action@v1.9.1
        continue-on-error: true
        with:
          scan-args: |-
            --lockfile=./package-lock.json
            --format=sarif
            --output=osv.sarif

      - name: Upload OSV SARIF
        if: always() && hashFiles('osv.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'osv.sarif'
          category: osv

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --only-verified --results=verified

  fs-scan:
    name: Filesystem Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Trivy filesystem (SARIF for Security tab)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-fs.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          ignore-unfixed: true

      - name: Upload filesystem SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-fs.sarif'
          category: trivy-fs

      - name: Trivy filesystem (blocking, CRITICAL only)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL'
          ignore-unfixed: true
          exit-code: '1'

  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest
    needs: [test, secret-scan, fs-scan]
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
      image_digest: ${{ steps.build.outputs.digest }}
      short_sha: ${{ steps.vars.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve short SHA
        id: vars
        run: echo "short_sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image with Cosign (keyless)
        env:
          COSIGN_EXPERIMENTAL: 'true'
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          for tag in $TAGS; do
            cosign sign --yes "${tag}@${DIGEST}"
          done

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Generate SBOM (SPDX + CycloneDX)
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          IMAGE="$(echo $TAGS | awk '{print $1}')@${DIGEST}"
          syft "$IMAGE" -o spdx-json > sbom.spdx.json
          syft "$IMAGE" -o cyclonedx-json > sbom.cyclonedx.json

      - name: Attach SBOM as Cosign attestation
        env:
          COSIGN_EXPERIMENTAL: 'true'
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          for tag in $TAGS; do
            cosign attest --yes \
              --predicate sbom.spdx.json \
              --type spdxjson \
              "${tag}@${DIGEST}"
          done

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: |
            sbom.spdx.json
            sbom.cyclonedx.json
          retention-days: 90

  image-scan:
    name: Image Scan
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: read
      security-events: write
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy image scan (SARIF for Security tab)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:sha-${{ needs.build-and-push.outputs.short_sha }}
          format: 'sarif'
          output: 'trivy-image.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          ignore-unfixed: true

      - name: Upload image SARIF
        if: always() && hashFiles('trivy-image.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-image.sarif'
          category: trivy-image

      - name: Trivy image scan (blocking, CRITICAL only)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:sha-${{ needs.build-and-push.outputs.short_sha }}
          severity: 'CRITICAL'
          ignore-unfixed: true
          exit-code: '1'

  update-manifest:
    name: Update Manifest
    runs-on: ubuntu-latest
    needs: image-scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Set up SSH for manifest repo
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.MANIFEST_DEPLOY_KEY }}

      - name: Clone manifest repo
        run: |
          git clone git@github.com:alexmchughdev/cicd-gitops-pipeline.git
          cd cicd-gitops-pipeline
          git config user.email "ci@github-actions"
          git config user.name "GitHub Actions"

      - name: Install kustomize
        env:
          KUSTOMIZE_VERSION: v5.4.3
        run: |
          curl -fsSL \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" \
            -o kustomize.tar.gz
          tar -xzf kustomize.tar.gz
          sudo mv kustomize /usr/local/bin/
          kustomize version

      - name: Bump image tag in overlay
        run: |
          cd cicd-gitops-pipeline/apps/alexmchugh-dev/overlays/production
          IMAGE_TAG="sha-$(echo ${{ github.sha }} | cut -c1-7)"
          kustomize edit set image \
            ghcr.io/alexmchughdev/alexmchugh-dev=ghcr.io/alexmchughdev/alexmchugh-dev:${IMAGE_TAG}

      - name: Commit and push
        run: |
          cd cicd-gitops-pipeline
          git add apps/alexmchugh-dev/
          git diff --staged --quiet || git commit -m "ci: bump alexmchugh-dev to sha-$(echo ${{ github.sha }} | cut -c1-7)

          Source: ${{ github.repository }}@${{ github.sha }}"
          git push
